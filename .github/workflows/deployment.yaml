name: Deployment

on:
  workflow_run:
    workflows: [Integration]
    types: [completed]

concurrency:
  group: ssl-proxy-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.availability.outputs.publish }}
    steps:
      - name: Check out the successful Integration commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify source is still master
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)" = "$SOURCE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Read version from source
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          header = Path('ssl_proxy/include/ssl_proxy_version.h').read_text()
          parts = []
          for name in ('MAJOR', 'MINOR', 'MICRO'):
              match = re.search(rf'^#define SSL_PROXY_VERSION_{name} ([0-9]+)$', header, re.MULTILINE)
              if not match:
                  raise SystemExit(f'Missing numeric version component: {name}')
              parts.append(match.group(1))
          tag = 'v' + '.'.join(parts)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          print(f'Release version: {tag}')
          PY

      - name: Check version availability
        id: availability
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          probe="$RUNNER_TEMP/ssl_proxy_tag_probe"
          if gh api -i "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$probe" 2>/dev/null; then
            if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != 'false' ]]; then
              echo "$RELEASE_TAG exists without a published release; refusing to change it" >&2
              exit 1
            fi
            echo "$RELEASE_TAG is already published; bump ssl_proxy_version.h for another release"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          elif ! head -1 "$probe" | grep -Eq '^HTTP/[^ ]+ 404 '; then
            echo "Could not determine whether $RELEASE_TAG already exists" >&2
            exit 1
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

  host-tests:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Test stream protocol and queue
        run: bash tests/run_stream_test.sh

      - name: Test sender
        run: bash tests/run_sender_test.sh

      - name: Test SSL capture boundary
        run: python3 -m unittest -v tests/test_passthrough_contract.py

  switch-build:
    needs: [prepare, host-tests]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      package_sha: ${{ steps.package_digest.outputs.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          submodules: recursive

      - name: Allow the container to read this checkout
        run: git config --system --add safe.directory "$PWD"

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify pinned submodules
        run: |
          test "$(git -C Atmosphere-libs rev-parse HEAD)" = "cf48d23375cf36742876f4b014971b2ebabc6dc8"
          test "$(git -C .deps/libnx rev-parse HEAD)" = "b156b4774fb2df7b93402169509266da7547fc4c"

      - name: Build pinned libnx
        run: |
          make -C .deps/libnx PREFIX=aarch64-none-elf-
          make -C .deps/libnx install

      - name: Build sysmodule and package
        run: make PREFIX=aarch64-none-elf-

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          packages = list(Path('out').glob('ssl_proxy-*.zip'))
          assert len(packages) == 1, packages
          title = 'atmosphere/contents/4200000000000666/'
          expected = {
              title + 'exefs.nsp',
              title + 'flags/boot2.flag',
              title + 'mitm.lst',
          }
          with ZipFile(packages[0]) as archive:
              actual = {name for name in archive.namelist() if not name.endswith('/')}
              assert actual == expected, (actual, expected)
              assert archive.read(title + 'mitm.lst') == b'ssl\nssl:s\n'
              assert len(archive.read(title + 'exefs.nsp')) > 0
          PY

      - name: Record package checksum
        id: package_digest
        run: echo "sha=$(sha256sum out/ssl_proxy-*.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssl_proxy-package
          path: out/ssl_proxy-*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload raw sysmodule output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ssl_proxy-raw
          path: ssl_proxy/out/*
          if-no-files-found: error
          compression-level: 9

  publish:
    needs: [prepare, switch-build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Recheck source, master, and version tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          BUILT_SHA: ${{ needs.switch-build.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test -n "$SOURCE_SHA"
          test "$BUILT_SHA" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)" = "$SOURCE_SHA"
          probe="$RUNNER_TEMP/ssl_proxy_tag_probe"
          if gh api -i "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$probe" 2>/dev/null; then
            echo "$RELEASE_TAG already exists; refusing to overwrite a release" >&2
            exit 1
          elif ! head -1 "$probe" | grep -Eq '^HTTP/[^ ]+ 404 '; then
            echo "Could not determine whether $RELEASE_TAG already exists" >&2
            exit 1
          fi

      - name: Download this run's package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ssl_proxy-package
          path: dist

      - name: Verify package and write checksum
        env:
          BUILT_PACKAGE_SHA: ${{ needs.switch-build.outputs.package_sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          packages = list(Path('dist').glob('ssl_proxy-*.zip'))
          assert len(packages) == 1, packages
          title = 'atmosphere/contents/4200000000000666/'
          expected = {
              title + 'exefs.nsp',
              title + 'flags/boot2.flag',
              title + 'mitm.lst',
          }
          with ZipFile(packages[0]) as archive:
              actual = {name for name in archive.namelist() if not name.endswith('/')}
              assert actual == expected, (actual, expected)
              assert archive.read(title + 'mitm.lst') == b'ssl\nssl:s\n'
              assert len(archive.read(title + 'exefs.nsp')) > 0
          PY
          test -n "$BUILT_PACKAGE_SHA"
          actual_sha="$(sha256sum dist/ssl_proxy-*.zip | awk '{print $1}')"
          test "$actual_sha" = "$BUILT_PACKAGE_SHA"
          cd dist
          sha256sum ssl_proxy-*.zip > SHA256SUMS
          test -s SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.source_sha }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/ssl_proxy-*.zip
            dist/SHA256SUMS

      - name: Verify published Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          BUILT_PACKAGE_SHA: ${{ needs.switch-build.outputs.package_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = 'false'
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-assets"
          cmp dist/SHA256SUMS "$RUNNER_TEMP/release-assets/SHA256SUMS"
          test "$(find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(sha256sum "$RUNNER_TEMP"/release-assets/ssl_proxy-*.zip | awk '{print $1}')" = "$BUILT_PACKAGE_SHA"
