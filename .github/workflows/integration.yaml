name: Integration

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          configFile: .commitlintrc.yaml

  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install C/C++ formatter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-18

      - name: Check formatting of changed C/C++ files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          git cat-file -e "$HEAD_SHA^{commit}"
          git cat-file -e "$BASE_SHA^{tree}"
          mapfile -d '' -t files < <(git diff --name-only -z --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- '*.c' '*.cpp' '*.h' '*.hpp')
          if (( ${#files[@]} == 0 )); then
            echo 'No changed C/C++ files to format-check.'
            exit 0
          fi
          clang-format-18 --dry-run --Werror "${files[@]}"
