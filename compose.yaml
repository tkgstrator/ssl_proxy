services:
  devkit:
    image: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    volumes:
      - ".:/code"
    working_dir: /code
    command: >-
      bash -lc 'git config --global --add safe.directory /code &&
      git submodule update --init --recursive &&
      make -C .deps/libnx PREFIX=aarch64-none-elf- &&
      make -C .deps/libnx install &&
      make PREFIX=aarch64-none-elf-'
